<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finn">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Finn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="appstyle">
:root{
  --bg:#eef1f7; --panel:#ffffff; --panel2:#f5f6f9; --line:#eceef3; --text:#14161c; --muted:#7a8091; --soft:#a3a8b6;
  --blue:#2563eb; --blue-d:#1e3a8a; --blue-l:#e8efff; --pink:#f43f6b; --pink-l:#ffe8ee; --green:#16a34a; --green-l:#e7f7ec;
  --amber:#f5c518; --amber-l:#fff6cc; --orange:#ec6b0c; --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.04);
  --r:18px;
}
[data-theme=dark]{
  --bg:#0c0f16; --panel:#151a24; --panel2:#1c2230; --line:#232a39; --text:#eef1f7; --muted:#8f97a8; --soft:#5f6779;
  --blue-l:#1b2b52; --pink-l:#3a1c27; --green-l:#163222; --amber-l:#3a3214; --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--text)}
.app{display:grid;grid-template-columns:232px 1fr;gap:16px;padding:16px;padding-top:max(16px, env(safe-area-inset-top));min-height:100vh;max-width:1480px;margin:0 auto}
.side{background:var(--panel);border-radius:var(--r);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:16px;height:calc(100vh - 32px);box-shadow:var(--shadow)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.avs{display:flex}.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;border:2px solid var(--panel)}
.av.b{background:var(--blue)}.av.p{background:var(--pink);margin-left:-8px}
.brand b{font-size:14px;display:block}.brand small{color:var(--muted);font-size:12px}
.navlbl{color:var(--muted);font-size:11.5px;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--text);opacity:.85;width:100%;text-align:left}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;opacity:.7}
.nav:hover{background:var(--panel2)}.nav.on{background:var(--panel2);font-weight:600;opacity:1}.nav.on svg{stroke:var(--blue);opacity:1}
.side .grow{flex:1}
.themebox{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;color:var(--muted)}
.seg{display:flex;background:var(--panel2);border-radius:999px;padding:3px}
.seg button{width:28px;height:24px;border-radius:999px;display:grid;place-items:center;font-size:13px}
.seg button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.who{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:14px 8px 0;margin-top:8px}
.who b{display:block;font-size:13px}.who small{font-size:11.5px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.top{background:var(--panel);border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.top .arrow{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.top .arrow:hover{background:var(--panel2);color:var(--text)}
.month{font-size:24px;font-weight:700;letter-spacing:-.02em}.month span{color:var(--soft);font-weight:500}
.top .sp{flex:1}
.bell{position:relative;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center}
.bell i{position:absolute;top:-6px;right:-6px;background:var(--pink);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px;border:2px solid var(--panel)}
.btn{background:var(--blue);color:#fff;font-weight:600;padding:10px 16px;border-radius:10px;display:flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.card{background:var(--panel);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);position:relative;min-width:0;overflow:hidden}
.span2{grid-column:span 2}.span3{grid-column:span 3}.row2{grid-row:span 2}
.ttl{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}.ttl small{color:var(--muted);font-weight:400;font-size:12px}
.lbl{color:var(--muted);font-size:12px}
.big{font-weight:800;letter-spacing:-.03em;line-height:1.05}.big .cur{color:var(--soft);font-weight:700;margin-right:6px}.big .ct{color:var(--muted);font-weight:500;font-size:.42em;letter-spacing:0}
.illo{position:absolute;right:18px;top:14px;width:84px;height:84px;border-radius:24px;display:grid;place-items:center;font-size:52px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.12))}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.pos{color:var(--green)}.neg{color:var(--pink)}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:3px;margin:22px 0 14px}
.stack div{height:100%;transition:flex .4s}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.legend .lbl{display:flex;align-items:center;gap:4px}
.legend b{font-size:14px;white-space:nowrap}.legend b small{color:var(--muted);font-weight:400;font-size:11px}
.split{display:flex;height:26px;border-radius:8px;overflow:hidden;position:relative;margin:8px 0 22px;font-size:11px;font-weight:700;color:#fff}
.split div{display:flex;align-items:center;padding:0 10px}
.split .mid{position:absolute;left:50%;top:-5px;bottom:-5px;width:2px;background:var(--text);border-radius:2px}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}.list .it .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it .v{font-weight:600;white-space:nowrap}
.chk{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--soft);flex:none;display:grid;place-items:center;color:#fff;font-size:11px;transition:.15s}
.chk.on{background:var(--green);border-color:var(--green)}
.it.paid .n,.it.paid .v{color:var(--soft);text-decoration:line-through}
.days{display:flex;gap:8px;margin:16px 0 8px;overflow-x:auto;scrollbar-width:none}
.days button{flex:1;min-width:56px;border:1px solid var(--line);border-radius:12px;padding:10px 4px 8px;font-weight:700;font-size:15px;text-align:center}
.days button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.days button.done{color:var(--soft)}
.days .dots{display:flex;gap:2px;justify-content:center;margin-top:4px;height:4px}.days .dots i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}
.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:14px -20px 0;padding:0 20px}
.cc{flex:none;width:min(320px,82%);aspect-ratio:1.6;border-radius:14px;padding:16px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;position:relative;overflow:hidden}
.cc:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.14),transparent 45%);pointer-events:none}
.cc .hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.cc .tag{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:600}
.chip{width:36px;height:27px;border-radius:6px;background:linear-gradient(135deg,#e9e9e9,#a9a9a9);position:relative}
.chip:before{content:"";position:absolute;inset:7px 0;border-top:1.5px solid rgba(0,0,0,.25);border-bottom:1.5px solid rgba(0,0,0,.25)}
.cc .ft{display:flex;justify-content:space-between;align-items:flex-end;font-size:10px;letter-spacing:.08em;opacity:.9}
.cc .ft b{display:block;font-size:13px;letter-spacing:0;margin-top:3px}
.prox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;position:relative}
.prox>div{background:var(--panel2);border-radius:12px;padding:10px 6px;text-align:center;height:120px;display:flex;flex-direction:column;justify-content:space-between;border:1.5px solid transparent;position:relative;z-index:1}
.prox>div.on{border-color:var(--blue);background:linear-gradient(to top,var(--blue-l) 50%,transparent 50%) var(--panel)}
.prox b{font-size:12.5px}.prox span{font-weight:700;font-size:13px;color:var(--muted)}.prox .on span{color:var(--blue)}
.prox svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.ctog{display:flex;background:var(--panel2);border-radius:10px;padding:3px;margin:14px 0 8px}
.ctog button{flex:1;padding:7px;border-radius:8px;font-size:12.5px;color:var(--muted)}
.ctog button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.meter{position:relative;height:16px;background:var(--panel2);border-radius:6px;margin:26px 0 6px}
.meter .f{height:100%;border-radius:6px;transition:width .4s}
.meter .ref{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--text);border-radius:2px}
.meter .ref span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:600;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin-top:12px}
.mgrid .m{display:flex;gap:10px;align-items:center}
.mgrid .ic{width:34px;height:34px;border-radius:10px;background:var(--blue-l);display:grid;place-items:center;font-size:16px;flex:none}
.mgrid small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mgrid b{font-size:13px}
.settle{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);margin:14px -20px -20px;padding:14px 20px;font-size:13px}
.settle .sp{flex:1}
.empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
.save{font-size:11.5px;color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,14,25,.45);display:none;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
.ov.show{display:flex}
.modal{background:var(--panel);width:min(720px,100%);max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:760px){.ov{align-items:center}.modal{border-radius:20px}}
.mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}.mh b{flex:1;font-size:16px}
.mtabs{display:flex;gap:6px;padding:10px 20px 0;overflow-x:auto;scrollbar-width:none}
.mtabs button{padding:7px 12px;border-radius:999px;font-size:12.5px;background:var(--panel2);white-space:nowrap}.mtabs button.on{background:var(--text);color:var(--panel)}
.mb{padding:16px 20px;overflow:auto;flex:1}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.fld span{font-size:12px;color:var(--muted)}
.in{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.in:focus{outline:2px solid var(--blue);outline-offset:-1px}
.erow{display:grid;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.erow.casa{grid-template-columns:1fr 104px 92px 56px 30px 30px}
.erow.pes{grid-template-columns:1fr 110px 60px 30px}
.erow.head{font-size:11px;color:var(--muted);border:0;padding-bottom:0}
.x{width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:16px}.x:hover{background:var(--pink-l);color:var(--pink)}
.cbox{width:18px;height:18px;accent-color:var(--blue)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.toast{opacity:0;position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--panel);padding:10px 16px;border-radius:12px;font-size:13px;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:500;white-space:nowrap}
.chipb.on{background:var(--text);color:var(--panel);border-color:var(--text)}
.txl{margin-top:6px;max-height:520px;overflow:auto}
.tx{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:10px;width:100%;text-align:left}
.tx:hover{background:var(--panel2)}
.tx .ic{width:36px;height:36px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:17px;flex:none}
.tx .n{flex:1;min-width:0}.tx .n b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .n small{color:var(--muted);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .v{font-weight:600;white-space:nowrap}
.dgrp{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;margin:14px 0 2px;text-transform:uppercase}
.bigin{font-size:30px;font-weight:800;border:0;background:transparent;width:100%;padding:6px 0;letter-spacing:-.02em;outline:none}
.hint{font-size:12.5px;color:var(--blue);background:var(--blue-l);padding:9px 11px;border-radius:9px}
@media(max-width:860px){.mf{flex-wrap:wrap}.mf .btn{flex:1;justify-content:center}}
.grid.solo{grid-template-columns:1fr;max-width:860px;width:100%}
.grid.solo .card{grid-column:auto;grid-row:auto}
.grid.solo .txl{max-height:none}
.more{white-space:nowrap;font-size:12px;font-weight:600;color:var(--blue);margin-left:auto;padding:2px 4px}
.ttl .more{margin-left:auto}
.card:has(.illo) .ttl{padding-right:96px}
.grid:not(.solo) #sec-contas{grid-row:span 3}
.saldo-top{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-top:18px;padding-right:90px}
.saldo-top>div:first-child{flex:1;min-width:220px}
.pd{background:var(--panel2);border-radius:14px;padding:12px 16px;min-width:230px;flex:1;max-width:340px}
.pd b{font-weight:700}
.alerts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.alert{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px}
.alert.warn{background:var(--amber-l);color:#9a7a00}.alert.over{background:var(--pink-l);color:var(--pink)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:0 10px;margin-bottom:10px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;padding:10px 0;outline:none;min-width:0}
.cc .tag{color:#fff;font-family:inherit;cursor:pointer}
.cc button.tag:hover{background:rgba(255,255,255,.3)}
@media(max-width:860px){.saldo-top{padding-right:0}.pd{max-width:none}.hide-xs{display:none}.tabbar button{font-size:9.5px}}
@media(max-width:1180px){.grid:not(.solo) #sec-contas{grid-row:auto}}
@media(max-width:860px){.card:has(.illo) .ttl{padding-right:70px}}
.crumb{font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.cnt{margin-left:auto;background:var(--pink);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px}
.tabbar{display:none}
@media(max-width:860px){
 .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
 .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0}
 .tabbar button span{font-size:19px;filter:grayscale(1);opacity:.6}
 .tabbar button.on{color:var(--blue);font-weight:600}.tabbar button.on span{filter:none;opacity:1}
 .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
@media(max-width:1180px){.grid{grid-template-columns:1fr 1fr}.span3{grid-column:span 2}.hide-md{display:none}}
@media(max-width:860px){
  .app{grid-template-columns:1fr;padding:10px;padding-top:max(10px, env(safe-area-inset-top));gap:10px}.side{display:none}
  main{gap:10px}.grid{grid-template-columns:1fr;gap:10px}.span2,.span3{grid-column:auto}
  .month{font-size:19px}.legend{grid-template-columns:1fr 1fr}.legend>div:last-child{grid-column:span 2}
  .illo{width:62px;height:62px;font-size:38px}.top .btn .t{display:none}
  .erow.casa{grid-template-columns:1fr 92px 30px;row-gap:6px}.erow.casa .w,.erow.casa .d,.erow.casa .mo{grid-row:2}.erow.head.casa{display:none}
}
@media(max-width:860px){.app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}}
/* fix: campos lado a lado no iPhone (input date tem largura mínima própria) */
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.two>*{min-width:0}
.in{min-width:0;max-width:100%}
input[type=date].in{-webkit-appearance:none;appearance:none;display:block;width:100%;min-height:42px;text-align:left;line-height:1.3}
input[type=date].in::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date].in::-webkit-calendar-picker-indicator{margin-left:0}
select.in{min-height:42px;text-overflow:ellipsis}
@media(max-width:860px){
 .mf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .mf .btn{justify-content:center;margin:0!important;white-space:nowrap}
 .mf .btn:only-child{grid-column:1/-1}
 .mf [data-addsave]:not([data-addsave=more]),.mf [data-savedraft],.mf [data-messave],.mf [data-csave],.mf [data-rsave]{grid-column:1/-1;order:-1;padding:13px 16px}
}
</style>

<script id="appjs">
(function(){
const STATIC_HEAD = document.head.innerHTML;
const APP_JS = document.getElementById('appjs').textContent;
const LS_KEY = 'finn-state-v1';
let S = JSON.parse(document.getElementById('state').textContent);
let storageOK = true;
try{ const raw = localStorage.getItem(LS_KEY); if(raw) S = JSON.parse(raw); }catch(e){ storageOK = false; }
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
let artifactNS = null, downloadsNS = null, canSave = false, saveTimer = null, saveMsg = 'Carregando…';
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MCURTO = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const today = new Date();
const pad = n => String(n).padStart(2,'0');
const todayStr = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
const TODAY_IDX = today.getFullYear()*12 + today.getMonth();
const VIEWS = {'visao-geral':'Visão geral','lancamentos':'Lançamentos','contas':'Contas a pagar','gastos':'Categorias','cartoes':'Cartões','historico':'Histórico'};
const hashView = () => { const h=(location.hash||'').slice(1); return VIEWS[h]?h:'visao-geral'; };

/* ---- recurring + all gastos ---- */
function G(){
  const hz = Math.max(TODAY_IDX, VIDX()) + 14, out = S.gastos.slice();
  S.recorrentes.forEach(r=>{
    const end = r.ate!=null ? Math.min(r.ate, hz) : hz;
    for(let i=r.desde;i<=end;i++){ const key=keyOf(i);
      out.push({id:r.id+'@'+key, rid:r.id, rec:true, descricao:r.descricao, valor:r.valor, data:`${key}-${pad(Math.min(r.dia,dim(i)))}`, cat:r.cat, metodo:r.metodo, parcelas:1, inicio:1, ts:0}); }
  });
  return out;
}
/* ---- card billing (cash) ---- */
function dueIdx(k, ds){
  const [y,m,d] = ds.split('-').map(Number); const P = y*12+(m-1); const pd = new Date(y,m-1,d);
  for(let M=P-1; M<=P+3; M++){
    const ci = (k.fecha < k.dia) ? M : M-1; const cy=Math.floor(ci/12), cm=ci%12;
    const cd = new Date(cy,cm,Math.min(k.fecha,new Date(cy,cm+1,0).getDate()));
    if(pd < cd) return M;
  }
  return P+1;
}
const nParc = g => Math.max(1, g.parcelas||1);
const iniParc = g => Math.min(nParc(g), Math.max(1, g.inicio||1));
const pvOf = g => Math.floor(g.valor/nParc(g)*100)/100;
const parcVal = (g,i) => i===nParc(g) ? r2(g.valor - pvOf(g)*(nParc(g)-1)) : pvOf(g);
let GL = [], CM = {}, COMP = {};
function rebuild(){
  GL = G(); CM = {}; COMP = {};
  GL.forEach(g=>{
    const n=nParc(g), ini=iniParc(g), P=idxOf(g.data), k=cardById(g.metodo);
    const d0 = k ? dueIdx(k, g.data) - (ini-1) : 0;
    for(let i=1;i<=n;i++){
      const v = parcVal(g,i);
      const ci = P + (i-ini); (COMP[ci] = COMP[ci] || []).push({g, v, i, n});
      if(k){ const key=k.id+'|'+(d0+i-1); (CM[key] = CM[key] || {total:0, items:[]}); CM[key].total=r2(CM[key].total+v); CM[key].items.push({g,v,i,n}); }
    }
  });
}
const parcInfo = g => { const k=cardById(g.metodo); if(!k) return null; const n=nParc(g); const first=dueIdx(k,g.data)-(iniParc(g)-1); return {k,n,first,last:first+n-1,pv:pvOf(g)}; };
const ajuste = (k, idx) => +(S.ajustes[keyOf(idx)]?.[k.id] || 0);
const fatura = (k, idx) => r2(ajuste(k,idx) + (CM[k.id+'|'+idx]?.total || 0));
const faturaPaga = (k, idx) => (S.meses[keyOf(idx)]?.pagos||[]).includes(k.id);
const limiteLivre = k => { let s=0; for(let i=TODAY_IDX-1;i<TODAY_IDX+40;i++) if(!faturaPaga(k,i)) s+=fatura(k,i); return r2((k.limite||0) - s); };

/* ---- month calc (competence) ---- */
function calc(V){
  const K = keyOf(V), MM = S.meses[K] || {};
  const sal = MM.salario ?? salPadrao(V);
  const entradasL = S.entradas.filter(e=>e.data.startsWith(K));
  const extras = r2(entradasL.reduce((a,b)=>a+b.valor,0));
  const receita = r2(sal + extras);
  const pulas = MM.pulas || [], vals = MM.valores || {};
  const cAll = S.contas.map(c=>({...c, padrao:c.valor, valor: vals[c.id] ?? c.valor, ajustada: vals[c.id]!=null, pulada: pulas.includes(c.id), fixa:true}));
  const cEf = cAll.filter(c=>!c.pulada);
  const sumF = f => r2(cEf.filter(f).reduce((a,b)=>a+b.valor,0));
  const moradia = sumF(c=>c.cat==='Moradia'), reserva = sumF(c=>c.cat==='Reserva'), outrasFixas = sumF(c=>c.cat!=='Moradia'&&c.cat!=='Reserva');
  const fixas = r2(moradia+reserva+outrasFixas);
  const avItems = (COMP[V] || []).filter(x=>!isCardM(x.g.metodo));
  const cardItems = S.cartoes.flatMap(k=>CM[k.id+'|'+V]?.items || []);
  const items = [...avItems, ...cardItems];
  const varCard = r2(cardItems.reduce((a,b)=>a+b.v,0));
  const varAvulso = r2(avItems.reduce((a,b)=>a+b.v,0));
  const ajTot = r2(S.cartoes.reduce((a,k)=>a+ajuste(k,V),0));
  const variaveis = r2(varCard + varAvulso + ajTot);
  const saldo = r2(receita - fixas - variaveis);
  const pc = {}; const add=(k,v)=>{ if(v>0) pc[k]=r2((pc[k]||0)+v); };
  cEf.forEach(c=>add(c.cat,c.valor)); items.forEach(x=>add(x.g.cat,x.v)); if(ajTot) add('Fatura (fora do app)', ajTot);
  const cats = Object.entries(pc).map(([k,v])=>({k,v,lim:+S.limites[k]||0})).sort((a,b)=>b.v-a.v);
  Object.entries(S.limites).forEach(([k,l])=>{ if(+l>0 && !pc[k]) cats.push({k,v:0,lim:+l}); });
  // per day
  const dIn = dim(V); let cartaoHoje=0, porDia=null, diasRest=0, gastoHoje=0, restaHoje=null, estado;
  if(V===TODAY_IDX){ diasRest = dIn - today.getDate() + 1; gastoHoje = r2(avItems.filter(x=>x.g.data===todayStr).reduce((a,b)=>a+b.v,0)); porDia = r2((saldo + gastoHoje)/diasRest); cartaoHoje = r2(GL.filter(g=>g.data===todayStr && isCardM(g.metodo)).reduce((a,b)=>a+b.valor,0)); restaHoje = r2(porDia - gastoHoje); estado='atual'; }
  else if(V>TODAY_IDX){ diasRest = dIn; porDia = r2(saldo/dIn); estado='futuro'; }
  else estado='passado';
  const contasAll = [
    ...S.cartoes.map(k=>({id:k.id, nome:'Fatura '+cname(k), valor:fatura(k,V), dia:k.dia, card:true})).filter(x=>x.valor>0),
    ...cAll
  ].sort((a,b)=>a.dia-b.dia || b.valor-a.valor);
  return {V, sal, extras, receita, entradasL, cAll, cEf, moradia, reserva, outrasFixas, fixas, varCard, varAvulso, ajTot, variaveis, saldo, cats, items,
    totalGasto: r2(fixas+variaveis), cartaoHoje, porDia, diasRest, gastoHoje, restaHoje, estado, contasAll, contas: contasAll.filter(x=>!x.pulada),
    compras: GL.filter(g=>g.data.startsWith(K))};
}

/* ---------- pieces ---------- */
function txRow(g, showDate){
  if(g.entrada) return `<button class="tx" data-eedit="${g.id}"><span class="ic" style="background:var(--green-l)">💰</span><span class="n"><b>${esc(g.descricao)}</b><small>Entrada${showDate?' · '+g.data.slice(8)+'/'+g.data.slice(5,7)+'/'+g.data.slice(2,4):''}</small></span><span class="v pos">+ ${fmt(g.valor)}</span></button>`;
  const k = cardById(g.metodo), pi = parcInfo(g);
  let sub = k ? `${esc(cname(k))}${g.parcelas>1?` · ${g.parcelas}x de ${fmt(pi.pv)} · ${mLabel(pi.first)} a ${mLabel(pi.last)}`:` · fatura ${mLabel(pi.first)}`}` : esc(metodoLabel(g.metodo));
  if(g.rec) sub = '🔁 mensal · ' + sub;
  if(showDate) sub = g.data.slice(8)+'/'+g.data.slice(5,7)+'/'+g.data.slice(2,4)+' · '+sub;
  return `<button class="tx" ${g.rec?`data-redit="${g.rid}"`:`data-gedit="${g.id}"`}><span class="ic">${catOf(g.cat).i}</span><span class="n"><b>${esc(g.descricao)}</b><small>${esc(g.cat)} · ${sub}</small></span><span class="v">${fmt(g.valor)}</span></button>`;
}
function lancListHTML(c){
  const q = ui.q.trim().toLowerCase();
  if(q){
    const hits = [...S.gastos, ...S.recorrentes.map(r=>({...r, id:r.id+'@x', rid:r.id, rec:true, data:keyOf(r.desde)+'-'+pad(r.dia), parcelas:1})), ...S.entradas.map(e=>({...e, entrada:true}))]
      .filter(g=> (g.descricao+' '+(g.cat||'')+' '+(g.entrada?'entrada':metodoLabel(g.metodo))).toLowerCase().includes(q))
      .sort((a,b)=>b.data.localeCompare(a.data)).slice(0,150);
    const tot = r2(hits.filter(x=>!x.entrada).reduce((a,b)=>a+b.valor,0));
    return `<div class="lbl" style="margin:12px 0 4px">${hits.length} resultado${hits.length===1?'':'s'} em todos os meses${tot?` · gastos somam ${fmt(tot)}`:''}</div>` + (hits.map(g=>txRow(g,true)).join('') || '<div class="empty">Nada encontrado.</div>');
  }
  const ents = c.entradasL.map(e=>({...e, entrada:true}));
  const list = (ui.filtro==='entradas' ? ents : [...c.compras.filter(g=> ui.filtro==='todos' || g.metodo===ui.filtro || (ui.filtro==='recorrentes' && g.rec)), ...(ui.filtro==='todos'?ents:[])])
    .sort((a,b)=> b.data.localeCompare(a.data) || (b.ts||0)-(a.ts||0));
  let html='', last='';
  list.forEach(g=>{
    if(g.data!==last){ last=g.data; const [y,m,d]=g.data.split('-').map(Number); const wd=new Date(y,m-1,d).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''); html += `<div class="dgrp">${g.data===todayStr?'Hoje':wd+', '+pad(d)+'/'+pad(m)}${g.data>todayStr?' · previsto':''}</div>`; }
    html += txRow(g,false);
  });
  return html || `<div class="empty">Nada lançado ${ui.filtro==='todos'?'neste mês':'com esse filtro'}.<br><button class="btn ghost sm" style="margin:10px auto 0" data-add>+ Lançar gasto</button></div>`;
}

function parcHTML(V){

  const totMes = r2(list.reduce((a,x)=> a + (x.pi.first<=V ? x.pi.pv : 0),0));

function histHTML(){
  const firstData = Math.min(TODAY_IDX, ...S.gastos.map(g=>idxOf(g.data)), ...S.entradas.map(e=>idxOf(e.data)), ...Object.entries(S.meses).filter(([k,m])=>m.salario!=null||(m.pagos||[]).length||Object.keys(m.valores||{}).length||(m.pulas||[]).length).map(([k])=>idxOf(k+'-01')), ...S.recorrentes.map(r=>r.desde));
  const end = Math.max(TODAY_IDX, VIDX()), start = Math.max(firstData, end-11);
  const rows = []; for(let i=start;i<=end;i++){ const c=calc(i); rows.push({i, receita:c.receita, gasto:c.totalGasto, saldo:c.saldo, fixas:c.fixas, variaveis:c.variaveis}); }
  const mx = Math.max(1, ...rows.map(r=>Math.max(r.receita,r.gasto)));
  const W=Math.max(rows.length*70,300), H=220, bw=Math.min(22, W/rows.length/3.2);

  const passados = rows.filter(r=>r.i<TODAY_IDX);

    <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${rows.length*44}px;max-height:260px">${bars}</svg></div>
    <div class="list" style="margin-top:8px">${rows.slice().reverse().map(r=>`<button class="it" style="width:100%;text-align:left" data-goto="${r.i}"><span class="n"><b>${MESES[r.i%12]} ${Math.floor(r.i/12)}</b><div class="lbl">renda ${fmt(r.receita)} · fixos ${fmt(r.fixas)} · faturas + Pix/débito ${fmt(r.variaveis)}</div></span><span class="v ${r.saldo>=0?'pos':'neg'}">${fmt(r.saldo)}</span></button>`).join('')}</div>

function proxHTML(V){

  return `<div class="prox">${vals.map((v,i)=>`<div class="${i===0?'on':''}"><div><b>${lbls[i]}</b>${i===0?'<div><span class="pill" style="background:var(--blue-l);color:var(--blue);font-size:10px">Este mês</span></div>':''}</div><span>${fmt(v)}</span></div>`).join('')}

}

const num = s => { s=String(s??'').trim().replace(/[^\d,.-]/g,''); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isNaN(n)?0:Math.round(n*100)/100; };

async function exportCSV(){
  const q = v => { const s=String(v??''); return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const n2 = v => v.toFixed(2).replace('.',',');
  const rows = [['Data','Tipo','Descrição','Categoria','Forma de pagamento','Parcelas','Valor']];
  S.gastos.slice().sort((a,b)=>a.data.localeCompare(b.data)).forEach(g=>rows.push([g.data.split('-').reverse().join('/'),'Gasto',g.descricao,g.cat,metodoLabel(g.metodo),nParc(g)>1?`${nParc(g)}x (desde ${iniParc(g)}ª)`:'1',n2(-g.valor)]));
  S.recorrentes.forEach(r=>{ const end = Math.min(r.ate ?? TODAY_IDX, TODAY_IDX); for(let i=r.desde;i<=end;i++) rows.push([`${pad(Math.min(r.dia,dim(i)))}/${pad(i%12+1)}/${Math.floor(i/12)}`,'Recorrente',r.descricao,r.cat,metodoLabel(r.metodo),'1',n2(-r.valor)]); });
  S.entradas.forEach(e=>rows.push([e.data.split('-').reverse().join('/'),'Entrada',e.descricao,'','','',n2(e.valor)]));
  const csv = '﻿' + rows.map(r=>r.map(q).join(';')).join('\r\n');
  const filename = `financas-${todayStr}.csv`;
  if(await saveFile(filename, csv, 'text/csv')) toast('Planilha exportada');
}

/* ---------- files: export / backup ---------- */
async function saveFile(filename, data, mime){
  const blob = new Blob([data], {type: mime});
  try{ const file = new File([blob], filename, {type: mime}); if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title: filename}); return true; } }catch(e){ if(e && e.name==='AbortError') return false; }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000); return true;
}
async function backup(){
  const ok = await saveFile(`finn-backup-${todayStr}.json`, JSON.stringify(S, null, 1), 'application/json');
  if(ok){ S.ultimoBackup = todayStr; changed(); toast('Backup gerado — guarde o arquivo (iCloud, WhatsApp, e-mail)'); }
}
function restaurar(file){
  const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(!d || !Array.isArray(d.gastos) || !d.renda) throw 0;
      if(!confirm('Restaurar este backup? Os dados atuais deste aparelho serão substituídos.')) return;
      S = d; clearTimeout(saveTimer); localStorage.setItem(LS_KEY, JSON.stringify(d)); location.reload(); }catch(e){ toast('Arquivo de backup inválido'); } };
  r.readAsText(file);
}
function goView(v){ ui.view = VIEWS[v]?v:'visao-geral'; try{ if(location.hash.slice(1)!==ui.view) history.replaceState(null,'','#'+ui.view); }catch(e){ try{ location.hash = ui.view; }catch(_){} } try{sessionStorage.setItem('dfView',ui.view)}catch(e){} render(); window.scrollTo(0,0); }
addEventListener('hashchange',()=>{ const v=hashView(); if(v!==ui.view){ ui.view=v; render(); window.scrollTo(0,0);} });

/* ---------- events ---------- */
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.id==='busca'){ ui.q=el.value; rebuild(); const t=$('#txl'); if(t) t.innerHTML=lancListHTML(calc(VIDX())); const ch=document.querySelector('#sec-lanc .chips'); if(ch) ch.style.display=ui.q?'none':''; const qc=document.querySelector('[data-qclear]'); if(qc) qc.style.display=ui.q?'':'none'; return; }
  if(ui.form && el.dataset.ff){ ui.form[el.dataset.ff]=el.value; const h=document.getElementById('fhint'); if(h) h.innerHTML=hintHTML(ui.form); }
});
document.addEventListener('change', e=>{ const el=e.target; if(el.id==='fRestore' && el.files && el.files[0]){ restaurar(el.files[0]); return; } if(ui.modal && el.dataset.rerender!==undefined){ syncForm(); render(); } });
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) { if(e.target.id==='ov'){ ui.modal=null; render(); } return; }
  const d = b.dataset;
  if(d.mon){ goMonth(VIDX() + +d.mon); render(); return; }
  if(d.hoje!==undefined){ goMonth(TODAY_IDX); render(); return; }
  if(d.goto){ goMonth(+d.goto); goView('visao-geral'); return; }
  if(d.view){ goView(d.view); return; }
  if(d.day){ ui.day=+d.day; render(); return; }
  if(d.flt){ ui.filtro=d.flt; render(); return; }
  if(d.qclear!==undefined){ ui.q=''; render(); return; }
  if(d.export!==undefined){ exportCSV(); return; }
  if(d.backup!==undefined){ backup(); return; }
  if(d.pay){ const M=mes(); const i=M.pagos.indexOf(d.pay); if(i>=0) M.pagos.splice(i,1); else { M.pagos.push(d.pay); toast(cardById(d.pay)?'Fatura paga — limite liberado':'Conta marcada como paga'); } changed(); return; }
  if(d.theme){ theme=d.theme; document.documentElement.dataset.theme=theme; try{localStorage.setItem('dfTheme',theme)}catch(e){} render(); return; }
  if(d.scroll){ const c=$('#cards'); c&&c.scrollBy({left:+d.scroll*c.clientWidth*.8,behavior:'smooth'}); return; }
  if(d.edit){ openEdit(d.edit); return; }
  if(d.add!==undefined){ openModal('add', newForm(), 'gasto'); return; }
  if(d.addtab){ syncForm(); ui.addTab=d.addtab; render(); return; }
  if(d.pm){ syncForm(); ui.form.metodo=d.pm; if(!cardById(d.pm)){ ui.form.parcelas=1; ui.form.inicio=1; } render(); return; }
  if(d.modo){ syncForm(); ui.form.modo=d.modo; render(); return; }
  if(d.addparc!==undefined){ const f=newForm(); const kk=S.cartoes[0]; if(kk){ f.metodo=kk.id; f.parcelas=10; f.cat='Compras'; } openModal('add', f, 'gasto'); return; }
  if(d.addrec!==undefined){ const f=newForm(); f.cat='Assinaturas'; f.dia=String(VIDX()===TODAY_IDX?today.getDate():1); if(S.cartoes[0]) f.metodo=S.cartoes[0].id; ui.draft=null; openModal('rec', f); return; }
  if(d.redit){ const r=S.recorrentes.find(x=>x.id===d.redit); if(r){ ui.draft=null; openModal('rec', {...r, valor:fmtN(r.valor), dia:String(r.dia)}); } return; }
  if(d.rsave!==undefined){ syncForm(); const f=ui.form, v=num(f.valor); if(!v){ toast('Informe o valor'); return; }
    const base = {descricao:(f.descricao||'').trim()||f.cat, valor:v, cat:f.cat, metodo:f.metodo, dia:clampDia(num(f.dia)||1)};
    const r=S.recorrentes.find(x=>x.id===f.id); if(r) Object.assign(r, base); else S.recorrentes.push({id:uid('r'), desde:VIDX(), ate:null, ...base});
    ui.modal=null; toast(r?'Recorrente atualizado':'Recorrente criado'); changed(); limiteAviso(base.cat, VIDX()); return; }
  if(d.rdel!==undefined){ S.recorrentes=S.recorrentes.filter(x=>x.id!==ui.form.id); ui.modal=null; toast('Recorrente excluído de todos os meses'); changed(); return; }
  if(d.rstop!==undefined){ const r=S.recorrentes.find(x=>x.id===ui.form.id); if(r){ r.ate=Math.max(r.desde, VIDX()); } ui.modal=null; toast(`Encerrado — último mês: ${mLabel(r.ate)}`); changed(); return; }
  if(d.rresume!==undefined){ const r=S.recorrentes.find(x=>x.id===ui.form.id); if(r) r.ate=null; ui.modal=null; toast('Recorrente reativado'); changed(); return; }
  if(d.gedit){ const g=S.gastos.find(x=>x.id===d.gedit); if(g) openModal('add', {...newForm(), ...g, inicio:g.inicio||1, modo:'total', valor:fmtN(g.valor)}, 'gasto'); return; }
  if(d.eedit){ const e=S.entradas.find(x=>x.id===d.eedit); if(e) openModal('add', {...newForm(), ...e, valor:fmtN(e.valor)}, 'entrada'); return; }
  if(d.gdel!==undefined){ const id=ui.form.id; S.gastos=S.gastos.filter(x=>x.id!==id); S.entradas=S.entradas.filter(x=>x.id!==id); ui.modal=null; toast('Excluído'); changed(); return; }
  if(d.mes!==undefined){ const MM=S.meses[mk()]||{}; openModal('mes', {salario:fmtN(MM.salario ?? salPadrao(VIDX())), padrao:false, eDesc:'', eValor:''}); return; }
  if(d.eadd!==undefined){ syncForm(); const v=num(ui.form.eValor); if(!v){ toast('Informe o valor da entrada'); return; }
    const dd = VIDX()===TODAY_IDX ? todayStr : `${ui.y}-${pad(ui.m+1)}-01`;
    S.entradas.push({id:uid('e'), descricao:(ui.form.eDesc||'').trim()||'Entrada', valor:v, data:dd, ts:Date.now()}); ui.form.eDesc=''; ui.form.eValor=''; toast('Entrada adicionada'); changed(); return; }
  if(d.edel){ syncForm(); S.entradas=S.entradas.filter(x=>x.id!==d.edel); changed(); return; }
  if(d.messave!==undefined){ syncForm(); const v=num(ui.form.salario); if(!v){ toast('Informe o salário'); return; }
    if(ui.form.padrao){ setPadrao(v); if(S.meses[mk()]) delete S.meses[mk()].salario; } else { mes().salario = v; }
    ui.modal=null; toast('Renda do mês atualizada'); changed(); return; }
  if(d.cedit){ const cc=S.contas.find(x=>x.id===d.cedit); if(!cc) return; const MM=S.meses[mk()]||{}; openModal('conta', {id:cc.id, valor:fmtN((MM.valores||{})[cc.id] ?? cc.valor)}); return; }
  if(d.csave!==undefined){ syncForm(); const M=mes(); const cc=S.contas.find(x=>x.id===ui.form.id); const v=num(ui.form.valor); M.valores=M.valores||{}; if(Math.abs(v-cc.valor)<0.005) delete M.valores[cc.id]; else M.valores[cc.id]=v; ui.modal=null; toast('Valor do mês salvo'); changed(); return; }
  if(d.creset!==undefined){ const M=mes(); if(M.valores) delete M.valores[ui.form.id]; ui.modal=null; toast('Voltou ao valor padrão'); changed(); return; }
  if(d.cpula!==undefined){ const M=mes(); M.pulas=M.pulas||[]; const i=M.pulas.indexOf(ui.form.id); if(i>=0){ M.pulas.splice(i,1); toast('Conta volta a valer neste mês'); } else { M.pulas.push(ui.form.id); toast('Conta pulada neste mês'); } ui.modal=null; changed(); return; }
  if(d.close!==undefined){ ui.modal=null; ui.draft=null; render(); return; }
  if(d.tab){ syncDraft(); ui.tab=d.tab; render(); return; }
  if(d.del){ syncDraft(); const [arr,i]=d.del.split('.'); ui.draft[arr].splice(+i,1); render(); return; }
  if(d.new){ syncDraft(); const D=ui.draft;
    if(d.new==='contas') D.contas.push({id:uid('c'),nome:'Nova conta',valor:0,dia:10,cat:'Outros'});
    if(d.new==='cartoes') D.cartoes.push({id:uid('k'),banco:'Banco',nome:'Cartão',cor:'#2563eb',dia:10,fecha:3,limite:0});
    render(); const mb=document.querySelector('.mb'); mb&&(mb.scrollTop=mb.scrollHeight); return; }
  if(d.savedraft!==undefined){ syncDraft(); const D=ui.draft;
    const nv=D.renda.salarioEdit; delete D.renda.salarioEdit; const mudou = nv!=null && Math.abs(nv-salPadrao(VIDX(),D))>0.004;
    D.contas.forEach(x=>x.dia=clampDia(x.dia)); D.cartoes.forEach(x=>{ x.dia=clampDia(x.dia); x.fecha=clampDia(x.fecha); });
    S=D; if(mudou) setPadrao(nv); ui.draft=null; ui.modal=null; toast('Ajustes salvos'); changed(); return; }
  if(d.addsave!==undefined){
    syncForm(); const f=ui.form, valor=num(f.valor);
    if(ui.addTab==='conta'){
      const nome=(f.nome||'').trim(); if(!nome||!valor){ toast('Preencha nome e valor'); return; }
      S.contas.push({id:uid('c'),nome,valor,dia:clampDia(num(f.dia)||10),cat:f.cat});
      ui.modal=null; toast('Conta fixa adicionada'); changed(); return;
    }
    if(!valor){ toast('Informe o valor'); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(f.data)){ toast('Informe a data'); return; }
    if(ui.addTab==='entrada'){
      const en = {id:f.id||uid('e'), descricao:(f.descricao||'').trim()||'Entrada', valor, data:f.data, ts:f.ts||Date.now()};
      const ei = S.entradas.findIndex(x=>x.id===en.id); if(ei>=0) S.entradas[ei]=en; else S.entradas.push(en);
      ui.modal=null; toast(ei>=0?'Entrada atualizada':'Entrada lançada'); changed(); return;
    }
    const descricao=(f.descricao||'').trim()||f.cat;
    const np = cardById(f.metodo)? Math.max(1,+f.parcelas||1) : 1;
    try{ localStorage.setItem('dfMetodo', f.metodo); }catch(e){}
    if(f.rep && np===1 && !f.id){
      S.recorrentes.push({id:uid('r'), descricao, valor, cat:f.cat, metodo:f.metodo, dia:+f.data.slice(8), desde:idxOf(f.data), ate:null});
      ui.modal=null; toast('🔁 Recorrente criado — repete todo mês'); changed(); limiteAvisoG({cat:f.cat, metodo:f.metodo, data:f.data}); return;
    }
    const g = {id:f.id||uid('g'), descricao, valor: np>1&&f.modo==='parcela' ? r2(valor*np) : valor, data:f.data, cat:f.cat, metodo:f.metodo, parcelas: np, inicio: np>1? Math.min(np,Math.max(1,+f.inicio||1)) : 1, ts: f.ts||Date.now()};
    const i = S.gastos.findIndex(x=>x.id===g.id); if(i>=0) S.gastos[i]=g; else S.gastos.push(g);
    if(idxOf(g.data) !== VIDX() && i<0) goMonth(idxOf(g.data));
    if(d.addsave==='more'){ const nf=newForm(); nf.data=g.data; nf.metodo=g.metodo; ui.form=nf; toast('Gasto lançado'); changed(); limiteAvisoG(g); setTimeout(()=>{const x=$('#fValor'); x&&x.focus();},40); return; }
    ui.modal=null; toast(i>=0?'Gasto atualizado':'Gasto lançado'); changed(); limiteAvisoG(g); return; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'&&ui.modal){ ui.modal=null; ui.draft=null; render(); return; }
  if(e.key!=='Enter'||e.target.tagName!=='INPUT'||e.target.id==='busca') return;
  const sel = ui.modal==='mes' && /eDesc|eValor/.test(e.target.dataset.ff||'') ? '[data-eadd]' : ui.modal==='conta' ? '[data-csave]' : ui.modal==='rec' ? '[data-rsave]' : ui.modal==='add' ? '[data-addsave]:not([data-addsave=more])' : null;
  if(sel){ e.preventDefault(); const b=document.querySelector('#ov '+sel); b&&b.click(); }
});
let rw; addEventListener('resize',()=>{ clearTimeout(rw); rw=setTimeout(()=>{ if(!ui.modal) render(); },200); });

render();
setSave(storageOK ? 'Salvo neste aparelho' : 'Este navegador não está salvando');
if(!S.nome){ setTimeout(()=>openEdit('renda'), 300); }
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
